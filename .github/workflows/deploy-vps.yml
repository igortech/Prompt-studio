name: Deploy to Production

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "❌ DEPLOY_HOST is empty"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "❌ DEPLOY_USER is empty"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then echo "❌ DEPLOY_KEY is empty"; exit 1; fi
          echo "✅ All secrets present"
          
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          debug: true
          script: |
            set -o pipefail
            whoami

            APP_DIR="/var/www/prompts.neiro-kod.ru"
            REPO_URL="https://github.com/igortech/Prompt-studio.git"

            git config --global --add safe.directory "$APP_DIR"
            cd "$APP_DIR"
            git stash || true
            git fetch origin
            git checkout release || git checkout -b release origin/release
            git pull origin release
            npm ci
            echo "📦 Building frontend..."
            sudo -n rm -rf dist
            sudo -n npm run build 2>&1 || { echo "❌ Frontend build failed"; exit 1; }
            echo "✅ Frontend build complete"
            sudo -n chown -R www-data:www-data dist
            echo "🔄 Restarting app..."
            sudo -n pm2 restart prompts-app 2>&1 || true
            sleep 5
            echo "📋 Checking PM2 status..."
            sudo -n pm2 status prompts-app || true
            echo "📋 Checking PM2 logs (last 100 lines)..."
            sudo -n pm2 logs prompts-app --lines 100 --nostream 2>&1 || true
            echo "✅ Checking app health..."
            curl -v http://localhost:3000 2>&1 || true
            echo "✅ Nginx reload..."
            sudo -n systemctl reload nginx || true
            echo "✅ Deployed at $(date)"
