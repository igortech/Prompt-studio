name: Deploy to Production

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "❌ DEPLOY_HOST is empty"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "❌ DEPLOY_USER is empty"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then echo "❌ DEPLOY_KEY is empty"; exit 1; fi
          echo "✅ All secrets present"
          
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          debug: true
          script: |
            set -euo pipefail
            trap 'echo "❌ Error on line $LINENO"; exit 1' ERR
            whoami

            APP_DIR="/var/www/prompts.neiro-kod.ru"

            cd "$APP_DIR"

            # фиксим права (страховка)
            sudo -n chown -R $USER:$USER "$APP_DIR"

            # Remove old compiled JS files to avoid conflicts
            find server -name "*.js" -type f -delete || true
            rm -f server.js

            git stash || true
            git fetch origin
            git checkout release || true
            git pull origin release

            rm -rf node_modules
            npm ci

            echo "📦 Building frontend..."
            rm -rf dist
            npm run build || { echo "❌ Frontend build failed"; exit 1; }

            sudo -n chown -R www-data:www-data dist

            echo "🔄 Starting/Restarting app..."
            sudo -n pm2 delete prompts-app || true
            sudo -n pm2 start ecosystem.config.js || true
            sudo -n pm2 save || true
            sleep 3
            
            echo "📋 Checking PM2 logs..."
            sudo -n pm2 logs prompts-app --lines 20 --nostream || true
            
            echo "✅ Deployed successfully"
