name: Deploy to Production

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "❌ DEPLOY_HOST is empty"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "❌ DEPLOY_USER is empty"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then echo "❌ DEPLOY_KEY is empty"; exit 1; fi
          echo "✅ All secrets present"
          
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          debug: true
          script: |
            set -e
            set -o pipefail
            whoami

            APP_DIR="/var/www/prompts.neiro-kod.ru"
            REPO_URL="https://github.com/igortech/Prompt-studio.git"

            git config --global --add safe.directory "$APP_DIR"
            cd "$APP_DIR"
            git stash
            git fetch origin
            git checkout release || git checkout -b release origin/release
            git pull origin release
            npm ci
            echo "📦 Building frontend..."
            sudo -n rm -rf dist
            sudo -n npm run build 2>&1 || { echo "❌ Frontend build failed"; exit 1; }
            echo "✅ Frontend build complete"
            echo "📦 Compiling server TypeScript..."
            sudo -n npx tsc -p tsconfig.server.json 2>&1 || { echo "❌ Server compilation failed"; exit 1; }
            echo "✅ Server compilation complete"
            ls -la server/services/crypto.js || echo "⚠️ crypto.js not found"
            sudo -n chown -R www-data:www-data dist
            echo "🔄 Restarting app..."
            sudo -n pm2 restart prompts-app 2>&1 || { echo "❌ PM2 restart failed"; sudo -n pm2 logs prompts-app --lines 20; exit 1; }
            echo "✅ App restarted"
            sudo -n systemctl reload nginx
            echo "✅ Nginx reloaded"
            echo "✅ Deployed successfully at $(date)"
