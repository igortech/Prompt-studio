name: Deploy Tokenizer to Production

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "❌ DEPLOY_HOST is empty"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "❌ DEPLOY_USER is empty"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_KEY }}" ]; then echo "❌ DEPLOY_KEY is empty"; exit 1; fi
          echo "✅ All secrets present"
          
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          debug: true
          script: |
            set -e
            set -o pipefail
            whoami
            APP_DIR="/var/www/prompts.neiro-kod.ru"
            REPO_URL="git@github.com:igortech/Prompt-studio.git"
            
            # Clone if directory doesn't exist or not a git repo
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 Cloning repository..."
              if [ -d "$APP_DIR" ]; then
                echo "❌ Directory exists but is not a git repository. Please remove it manually or check permissions."
                exit 1
              fi
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            git fetch origin
            git checkout release || git checkout -b release origin/release
            git pull origin release
            npm install
            npm run build
            echo "✅ Deployed successfully at $(date)"
